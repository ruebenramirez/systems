# The workflow name and the job id below form the status-check context
# `flake check (PR) / check (pull_request)`, which `master` requires. Renaming
# either orphans that rule: the required context stops reporting and no PR can
# merge until the rule is updated. See docs/ci.md.
name: flake check (PR)
run-name: "flake check: ${{ github.event.pull_request.title || github.ref_name }}"

# Gate every PR before it can merge. Nothing here deploys or activates anything;
# it only proves the tree parses, the flake evaluates, every configuration still
# builds, and the declared secrets/docs resolve.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# All builds run on fwai0 and must not overlap; `false` means a queued run waits
# instead of cancelling a deploy in progress. See docs/ci.md.
concurrency:
  group: fwai0-builder
  cancel-in-progress: false

# systems-secrets is fetched over git from ~/.netrc, so HOME must be the deploy
# home and the extraheader actions/checkout installs must be blanked. See
# docs/secrets.md, "The private systems-secrets input".
env:
  HOME: /var/lib/nixdeploy
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.https://code.rueb.dev/.extraheader"
  GIT_CONFIG_VALUE_0: ""

jobs:
  # Its id, `check`, is part of the required status-check context; see above.
  check:
    runs-on: nixos
    # A PR that moves flake.lock rebuilds the fleet's inputs on fwai0.
    timeout-minutes: 120
    steps:
      - name: Check out the PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Resolve the private input once; the two checks below reuse SECRETS_DIR.
      - name: Resolve systems-secrets
        run: |
          set -euo pipefail
          secrets_dir="$(nix eval --raw --impure \
            --extra-experimental-features 'nix-command flakes' \
            --expr "builtins.toString (builtins.getFlake \"$PWD\").inputs.systems-secrets.outPath")"
          echo "SECRETS_DIR=$secrets_dir" >> "$GITHUB_ENV"

      # Fail here, not at boot on a machine nobody is standing next to: every
      # sops.secrets declaration must resolve to a key the host can decrypt.
      - name: Check sops secrets
        run: scripts/check-sops-secrets.sh

      # Docs carry the procedures; a stale secrets path or dead link is a wrong
      # instruction handed to whoever debugs this next.
      - name: Check doc references
        run: scripts/check-docs-paths.sh

      # Parse locally, then ship the source and inputs to fwai0 and evaluate and
      # build there; the runner neither compiles nor evaluates the fleet.
      - name: Check the flake
        env:
          FLAKE_DIR: ${{ github.workspace }}
          BUILDER_HOSTNAME: "fwai0"
          CHECK_LOG: /var/lib/nixdeploy/flake-check-${{ github.run_id }}.log
        run: dotfiles/bin/nup-fleet --check 2>&1 | tee "$CHECK_LOG"

      # A check that rewrites the tree it is checking is a bug, not a result.
      - name: Verify the checkout is untouched
        run: |
          set -euo pipefail
          git diff --quiet -- flake.lock \
            || { echo "flake.lock was rewritten by the check; it must be committed in the PR" >&2; exit 1; }

      - name: Report
        if: always()
        env:
          CHECK_LOG: /var/lib/nixdeploy/flake-check-${{ github.run_id }}.log
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### flake check"
            echo ""
            echo "- Builder: \`fwai0\` (builds land there, nothing is deployed)"
            echo "- PR: \`${{ github.event.pull_request.number || 'n/a' }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$summary"
          if [[ -r "$CHECK_LOG" ]]; then
            # nix prints renamed/deprecated options as evaluation warnings:
            # worth a look, never worth failing a PR over.
            grep -oE 'evaluation warning: .*' "$CHECK_LOG" | sort -u \
              | while IFS= read -r line; do echo "::warning::${line#'evaluation warning: '}"; done
            {
              echo '```'
              grep -E '^(✓|✗|Failed builds)' "$CHECK_LOG" || echo "(the check did not report)"
              echo '```'
            } >> "$summary"
          else
            echo "- no check log (the job failed before the check started)" >> "$summary"
          fi
          rm -f "$CHECK_LOG"

  # Failure-only Matrix ping: a passing check stays silent.
  notify:
    needs: [check]
    if: failure()
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Notify Hermes
        env:
          HERMES_WEBHOOK_URL: "${{ vars.HERMES_WEBHOOK_URL }}"
          HERMES_WEBHOOK_SECRET: "${{ secrets.HERMES_WEBHOOK_SECRET }}"
          WORKFLOW: "${{ github.workflow }}"
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_RESULT: ${{ needs.check.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$CHECK_RESULT" in
            cancelled) status=cancelled ;;
            *)         status=failure ;;
          esac
          scripts/hermes-notify.sh "$status"
