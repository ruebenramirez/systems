name: nup-fleet upgrade
run-name: "nup-fleet upgrade (${{ github.event.inputs.machines || 'whole fleet' }})"

# Merged PRs upgrade the fleet immediately; the nightly re-locks and redeploys.
# This job commits flake.lock back to master, so don't re-trigger on it.
on:
  schedule:
    - cron: "30 8 * * *" # 03:30 America/Chicago (02:30 in winter)
  push:
    branches: [master]
    paths-ignore:
      - flake.lock
  workflow_dispatch:
    inputs:
      machines:
        description: "Space-separated machines to upgrade (empty = whole fleet)"
        required: false
        default: ""

# All builds run on fwai0 and must not overlap; `false` means a queued run waits
# instead of cancelling a deploy in progress. See docs/ci.md.
concurrency:
  group: fwai0-builder
  cancel-in-progress: false

# systems-secrets is fetched over git from ~/.netrc, so HOME must be the deploy
# home and the extraheader actions/checkout installs must be blanked -- except
# in the checkout steps themselves, which un-blank it to authenticate with the
# per-run task token instead of the netrc. See docs/secrets.md, "The private
# systems-secrets input".
env:
  HOME: /var/lib/nixdeploy
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.https://code.rueb.dev/.extraheader"
  GIT_CONFIG_VALUE_0: ""

jobs:
  # One job: move the lock exactly once, validate secrets against it, deploy at
  # that lock (best-effort), then persist the lock. See docs/ci.md.
  upgrade:
    runs-on: nixos
    timeout-minutes: 630
    steps:
      - name: Check out the flake
        id: checkout
        # Un-blank the extraheader for this step (GIT_CONFIG_COUNT=0): checkout
        # authenticates with the per-run task token, so it must not depend on
        # the netrc token the blanked steps use.
        env:
          GIT_CONFIG_COUNT: "0"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # checkout empties the workspace before it fetches, so a dead checkout leaves
      # every later step reaching for scripts that are not there. The expression
      # gates below exist for a readable log; this is the load-bearing check, and
      # it tests the filesystem precisely so it cannot be skipped by an expression
      # the runner fails to evaluate -- which would leave a green run that did
      # nothing.
      - name: Verify the checkout produced a tree
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          missing=0
          for f in flake.nix dotfiles/bin/nup-fleet scripts/check-sops-secrets.sh \
                   scripts/ci-arm-runner-self-switch.sh scripts/ci-push-flake-lock.sh \
                   scripts/ci-alert-mail.sh; do
              [[ -e "$f" ]] \
                || { echo "::error::$f is missing: the checkout did not populate the workspace" >&2; missing=1; }
          done
          exit "$missing"

      # Clear last run's summary/log so a skipped deploy cannot be mistaken for
      # an updated fleet by the persist step.
      - name: Refresh the flake lock
        if: ${{ steps.checkout.outcome == 'success' }}
        env:
          FLAKE_DIR: ${{ github.workspace }}
          RUN_LOG: /var/lib/nixdeploy/nup-fleet-upgrade.log
          NUP_FLEET_SUMMARY: /var/lib/nixdeploy/nup-fleet-summary
        run: |
          set -euo pipefail
          rm -f "$NUP_FLEET_SUMMARY"
          : > "$RUN_LOG"
          dotfiles/bin/nup-fleet --flake-update-only

      - name: Check declared sops secrets exist
        if: ${{ steps.checkout.outcome == 'success' }}
        run: scripts/check-sops-secrets.sh

      # Best-effort: every reachable machine is upgraded; unreachable ones are
      # recorded and make the run fail. See docs/ci.md.
      - name: Upgrade the fleet
        if: ${{ steps.checkout.outcome == 'success' }}
        env:
          FLAKE_DIR: ${{ github.workspace }}
          EXCLUDE: "${{ vars.NUP_FLEET_EXCLUDE || 'forgejo-ci-runner-vm' }}"
          BUILDER_HOSTNAME: "fwai0"
          MACHINES: ${{ github.event.inputs.machines }}
          RUN_LOG: /var/lib/nixdeploy/nup-fleet-upgrade.log
          NUP_FLEET_SUMMARY: /var/lib/nixdeploy/nup-fleet-summary
        run: |
          set -euo pipefail
          read -r -a requested <<< "${MACHINES:-}"
          dotfiles/bin/nup-fleet ${requested[@]+"${requested[@]}"} 2>&1 | tee "$RUN_LOG"

      # The fleet deploy skips this VM, so promise its own switch here and let it
      # land after the job releases the runner. Armed even when hosts failed: the
      # runner's config is independent of theirs.
      - name: Arm the runner's own switch
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          RUNNER_SELF_SWITCH_DELAY: 90s
        run: scripts/ci-arm-runner-self-switch.sh

      # Runs even when some hosts failed; the script pushes only if at least one
      # machine was updated. The job still ends red if any machine failed.
      - name: Persist updated flake.lock
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.machines == '') }}
        env:
          BRANCH: ${{ github.ref_name }}
          CI_FLAKELOCK_PUSH: ${{ secrets.CI_FLAKELOCK_PUSH }}
          NUP_FLEET_SUMMARY: /var/lib/nixdeploy/nup-fleet-summary
        run: scripts/ci-push-flake-lock.sh

      - name: Email failure report
        if: failure()
        env:
          WORKFLOW: ${{ github.workflow }}
          TRIGGER: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REQUESTED: ${{ github.event.inputs.machines }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: "failure"
          RUN_LOG: /var/lib/nixdeploy/nup-fleet-upgrade.log
          NUP_FLEET_SUMMARY: /var/lib/nixdeploy/nup-fleet-summary
          RECIPIENT: r3v2@rueb.dev
        run: |
          set -uo pipefail
          if [[ -f scripts/ci-alert-mail.sh ]]; then
              scripts/ci-alert-mail.sh
              exit $?
          fi
          # Nothing in the repo is on disk to send the report with, which is how
          # run 211 failed a nightly in silence. msmtp and /etc/msmtprc come from
          # the runner's own config, so a failure can still reach a human.
          command -v msmtp >/dev/null 2>&1 || {
              echo "::warning title=Alert mail not sent::msmtp is not on PATH on $(hostname)"; exit 0; }
          recipient="$RECIPIENT"
          {
              printf 'From: root@rueb.dev\nTo: %s\n' "$recipient"
              printf 'Subject: [CI FAIL] %s (%s) on %s\n' \
                  "${WORKFLOW:-systems}" "${TRIGGER:-unknown}" "$(hostname)"
              printf 'Date: %s\nContent-Type: text/plain; charset=utf-8\n\n' "$(date -R)"
              printf 'The job could not check out the flake; nothing else ran.\n'
              printf 'Branch:  %s @ %s\nRun:     %s\nHost:    %s\n' \
                  "${BRANCH:-}" "${SHA:-}" "${RUN_URL:-}" "$(hostname)"
          } | msmtp "$recipient" \
              || echo "::warning title=Alert mail not sent::msmtp could not submit to the mail server"

  # Run notifications: Hermes webhook (Matrix) on every outcome; a cancelled
  # run is reported but not mailed (no failure email on cancellation).
  notify:
    needs: [upgrade]
    if: always()
    runs-on: nixos
    timeout-minutes: 5
    steps:
      # The notify script lives in the repo; host-mode jobs get a fresh
      # workspace per job, so it must be checked out here too.
      - name: Check out the repo
        env:
          GIT_CONFIG_COUNT: "0"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Notify Hermes
        env:
          HERMES_WEBHOOK_URL: "${{ vars.HERMES_WEBHOOK_URL }}"
          HERMES_WEBHOOK_SECRET: "${{ secrets.HERMES_WEBHOOK_SECRET }}"
          WORKFLOW: "${{ github.workflow }}"
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
        run: |
          set -euo pipefail
          case "$UPGRADE_RESULT" in
            success)   status=success ;;
            cancelled) status=cancelled ;;
            *)         status=failure ;;
          esac
          scripts/hermes-notify.sh "$status"
